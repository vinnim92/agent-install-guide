name: Validate Scripts

on:
  push:
    paths:
      - 'scripts/install-claude-code.sh'
      - 'scripts/install-codex.sh'
      - 'scripts/install-openclaw.sh'
      - 'scripts/install-claude-code.ps1'
      - 'scripts/install-codex.ps1'
      - 'scripts/install-openclaw.ps1'
      - 'docs/i/claude.sh'
      - 'docs/i/claude.ps1'
      - 'docs/i/claude-code.sh'
      - 'docs/i/claude-code.ps1'
      - 'docs/i/codex.sh'
      - 'docs/i/codex.ps1'
      - 'docs/i/openclaw.sh'
      - 'docs/i/openclaw.ps1'
      - 'scripts/lib/**'
      - 'scripts/check-scripts.sh'
  workflow_dispatch:

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax check (bash)
        run: |
          for f in \
            scripts/install-claude-code.sh \
            scripts/install-codex.sh \
            scripts/install-openclaw.sh \
            docs/i/claude.sh \
            docs/i/claude-code.sh \
            docs/i/codex.sh \
            docs/i/openclaw.sh
          do
            bash -n "$f" || exit 1
            echo "$f: syntax OK"
          done

      - name: Run check-scripts.sh
        run: |
          bash scripts/check-scripts.sh

      - name: Test --help (real install scripts)
        run: |
          for f in scripts/install-claude-code.sh scripts/install-codex.sh scripts/install-openclaw.sh; do
            echo "=== $f --help ==="
            bash "$f" --help 2>&1 | head -3
          done

      - name: Test --dry-run (real install scripts)
        run: |
          for f in scripts/install-claude-code.sh scripts/install-codex.sh scripts/install-openclaw.sh; do
            echo "=== $f --dry-run ==="
            AGENT_INSTALL_YES=1 bash "$f" --dry-run 2>&1 | tail -3
          done

      - name: Test --dry-run (short entry scripts)
        run: |
          for f in docs/i/claude.sh docs/i/claude-code.sh docs/i/codex.sh docs/i/openclaw.sh; do
            echo "=== $f --dry-run ==="
            AGENT_INSTALL_YES=1 bash "$f" --dry-run 2>&1 | tail -3
          done

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax check (PowerShell) — real install scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/install-claude-code.ps1',
            'scripts/install-codex.ps1',
            'scripts/install-openclaw.ps1'
          )
          foreach ($s in $scripts) {
            $path = Join-Path $pwd $s
            $content = Get-Content $path -Raw
            $block = [scriptblock]::Create($content)
            Write-Host "$s : syntax OK"
          }

      - name: Syntax check (PowerShell) — short entry scripts
        shell: pwsh
        run: |
          $scripts = @(
            'docs/i/claude.ps1',
            'docs/i/claude-code.ps1',
            'docs/i/codex.ps1',
            'docs/i/openclaw.ps1'
          )
          foreach ($s in $scripts) {
            $path = Join-Path $pwd $s
            $content = Get-Content $path -Raw
            $block = [scriptblock]::Create($content)
            Write-Host "$s : syntax OK"
          }

      - name: Test -Help (real install scripts)
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/install-claude-code.ps1',
            'scripts/install-codex.ps1',
            'scripts/install-openclaw.ps1'
          )
          foreach ($s in $scripts) {
            Write-Host "=== $s -Help ==="
            & $s -Help 2>&1 | Select-Object -First 3
          }

      - name: Test -DryRun (real install scripts)
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/install-claude-code.ps1',
            'scripts/install-codex.ps1',
            'scripts/install-openclaw.ps1'
          )
          foreach ($s in $scripts) {
            Write-Host "=== $s -DryRun ==="
            $env:AGENT_INSTALL_YES = '1'
            & $s -DryRun 2>&1 | Select-Object -Last 3
          }

      - name: Test -DryRun (short entry scripts)
        shell: pwsh
        run: |
          $scripts = @(
            'docs/i/claude.ps1',
            'docs/i/claude-code.ps1',
            'docs/i/codex.ps1',
            'docs/i/openclaw.ps1'
          )
          foreach ($s in $scripts) {
            Write-Host "=== $s -DryRun ==="
            $env:AGENT_INSTALL_YES = '1'
            & $s -DryRun 2>&1 | Select-Object -Last 3
          }

name: Test install.sh

on:
  push:
    paths:
      - 'scripts/install.sh'
      - 'scripts/lib/**'
  workflow_dispatch:

jobs:
  test-ubuntu:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run install.sh
        run: |
          echo "============================================"
          echo "  Testing install.sh on ${{ matrix.os }}"
          echo "  Date: $(date)"
          echo "============================================"
          bash scripts/install.sh 2>&1
          echo ""
          echo "============================================"
          echo "  Verification"
          echo "============================================"

      - name: Verify installations
        run: |
          set -e
          FAILED=0

          echo ""
          echo "--- Claude Code ---"
          if command -v claude &>/dev/null; then
            claude --version 2>&1 | head -1 || echo "(version check done)"
            echo "✅ Claude Code installed"
          else
            echo "❌ Claude Code NOT found"
            FAILED=1
          fi

          echo ""
          echo "--- Codex ---"
          if command -v codex &>/dev/null; then
            codex --version 2>&1 || echo "(version check done)"
            echo "✅ Codex installed"
          else
            echo "❌ Codex NOT found"
            FAILED=1
          fi

          echo ""
          echo "--- OpenClaw ---"
          if command -v openclaw &>/dev/null; then
            openclaw --version 2>&1 || echo "(version check done)"
            echo "✅ OpenClaw installed"
          else
            echo "⚠️  OpenClaw not found (non-critical — may need network)"
          fi

          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "=== ❌ CORE INSTALLS FAILED ==="
            exit 1
          else
            echo "=== ✅ CORE INSTALLS VERIFIED ==="
          fi

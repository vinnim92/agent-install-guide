name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-chinese fonts-noto fonts-noto-cjk

      - name: Build PDF
        run: |
          pandoc docs/guide.md \
            -o guide.pdf \
            --pdf-engine=xelatex \
            -V mainfont="Noto Sans" \
            -V CJKmainfont="Noto Sans CJK SC" \
            -V geometry:margin=1in \
            -V title="AI Coding Agent 全平台安装指南" \
            --toc --toc-depth=2 \
            --metadata date="$(date '+%Y-%m-%d')"

      - name: Validate Scripts
        run: |
          bash -n scripts/install.sh || exit 1
          echo "install.sh: syntax OK"

      - name: Create Release Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p release/agent-install-guide-${VERSION}
          cp guide.pdf release/agent-install-guide-${VERSION}/
          cp -r scripts release/agent-install-guide-${VERSION}/
          cp docs/troubleshooting.md release/agent-install-guide-${VERSION}/
          cp README.md release/agent-install-guide-${VERSION}/
          cd release
          zip -r agent-install-guide-${VERSION}.zip agent-install-guide-${VERSION}/
          echo "Package: agent-install-guide-${VERSION}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "AI 编程助手零基础安装指南 ${{ github.ref_name }}"
          body: |
            ## 🤖 AI 编程助手 · 零基础安装指南 ${{ github.ref_name }}

            ### 会复制粘贴就会装

            不需要懂任何技术。一键安装三款最火的 AI 编程助手：

            - 🧠 **Claude Code** — Anthropic 出品，最聪明的 AI 程序员
            - ⚡ **Codex** — OpenAI 出品，ChatGPT 用户首选
            - 🦞 **OpenClaw** — 微软开源，有免费模型可白嫖

            ### 📦 本压缩包包含

            1. 📄 `guide.pdf` — 零基础图文手册（从"怎么打开终端"开始教）
            2. 🔧 `scripts/install.sh` — Mac 一键安装脚本
            3. 🔧 `scripts/install.ps1` — Windows 一键安装脚本
            4. 🛠 `troubleshooting.md` — 7 个常见问题手把手解决

            ### 🚀 快速开始

            **Mac**：打开终端，粘贴运行：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/vinnim92/agent-install-guide/main/scripts/install.sh | bash
            ```

            **Windows**：打开 PowerShell，粘贴运行：
            ```powershell
            iwr -useb https://raw.githubusercontent.com/vinnim92/agent-install-guide/main/scripts/install.ps1 | iex
            ```

            剩下的全自动完成，你等着就行。

            ### 📝 更新日志

            - v2.0: 完全重写为零基础版，新增自动环境安装，去除所有技术术语
            - v1.0: 初始版本
          files: release/agent-install-guide-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
